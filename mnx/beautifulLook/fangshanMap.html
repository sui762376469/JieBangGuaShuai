<!DOCTYPE html>
<html style="height: 100%">
<head>
    <meta charset="utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 主容器：左右分栏 */
        .container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        /* 左侧地图区域 */
        .left-panel {
            flex: 1;
            min-width: 300px;
            height: 100%;
            position: relative;
            transition: flex 0.3s ease;
        }

        #container {
            width: 100%;
            height: 100%;
        }

        /* 拖拽分隔条 */
        .divider {
            width: 6px;
            background: #404a59;
            cursor: col-resize;
            position: relative;
            flex-shrink: 0;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .divider:hover,
        .divider.active {
            background: #50a3ba;
        }

        /* 分隔条上的拖拽手柄图标 */
        .divider::before {
            content: '';
            width: 2px;
            height: 40px;
            background: rgba(255,255,255,0.4);
            border-radius: 1px;
        }

        .divider:hover::before {
            background: rgba(255,255,255,0.8);
        }

        /* 折叠按钮（在分隔条上） */
        .collapse-btn {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 40px;
            background: #50a3ba;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
            z-index: 10;
            transition: all 0.2s;
        }

        .collapse-btn:hover {
            background: #eac736;
            color: #333;
        }

        /* 右侧面板 */
        .right-panel {
            width: 400px;          /* 默认宽度 */
            min-width: 250px;
        max-width: 70vw;
            height: 100%;
            background: #fff;
            border-left: 1px solid #ddd;
            overflow: auto;
            transition: width 0.35s ease, opacity 0.3s ease, margin 0.3s ease;
            box-shadow: -2px 0 8px rgba(0,0,0,0.15);
        }

        /* 右侧面板头部 */
        .panel-header {
            padding: 16px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-header h3 {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }

        .panel-close-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: #999;
            font-size: 18px;
            cursor: pointer;
            border-radius: 4px;
            line-height: 28px;
            text-align: center;
            transition: all 0.2s;
        }

        .panel-close-btn:hover {
            background: #fee;
            color: #d94e5d;
        }

        /* 右侧内容区 */
        .panel-content {
            padding: 20px;
        }

        /* 统计表格样式 */
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .stats-table th,
        .stats-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .stats-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
            position: sticky;
            top: 0;
        }

        .stats-table tr:hover td {
            background: #f0f7ff;
        }

        .count-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }

        .count-high { background: #d94e5d; }
        .count-mid { background: #eac736; color: #333; }
        .count-low { background: #50a3ba; }
        .count-zero { background: #ccc; }

        /* 折叠状态 */
        .right-panel.collapsed {
            width: 0 !important;
            min-width: 0 !important;
            opacity: 0;
            overflow: hidden;
            margin-left: -1px;
        }

        .collapsed + .divider .collapse-btn::after {
            content: '◀';
        }

        .divider .collapse-btn::after {
            content: '▶';
        }

        /* 拖拽时的遮罩层提示 */
        .resize-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            cursor: col-resize;
            z-index: 9999;
            display: none;
        }

        .resize-overlay.active {
            display: block;
        }

        /* 汇总信息卡片 */
        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .summary-card .total-num {
            font-size: 36px;
            font-weight: 700;
        }

        .summary-card .total-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧地图 -->
        <div class="left-panel" id="leftPanel">
            <div id="container"></div>
        </div>

        <!-- 拖拽分隔条 -->
        <div class="divider" id="divider">
            <button class="collapse-btn" id="collapseBtn" title="折叠/展开右侧面板"></button>
        </div>

        <!-- 右侧信息面板 -->
        <div class="right-panel" id="rightPanel">
            <div class="panel-header">
                <h3>📊 数据统计</h3>
                <button class="panel-close-btn" id="panelCloseBtn" title="关闭此侧边界面">×</button>
            </div>
            <div class="panel-content">
            </div>
        </div>
    </div>

    <!-- 拖拽时的遮罩层 -->
    <div class="resize-overlay" id="resizeOverlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script>
        // ========== 地图初始化 ==========
        var myChart = echarts.init(document.getElementById("container"));
        var mapData = [];

        // 加载地图和数据
        fetch('./fangshan.json')
            .then(function(r) { return r.json(); })
            .then(function(geoJson) {
                return fetch('./fangshan_showtimes.json')
                    .then(function(r) { return r.json(); })
                    .then(function(statData) {
                        mapData = statData;
                        return geoJson;
                    });
            })
            .then(function(geoJson) {
                echarts.registerMap('fangshan', geoJson);

                var option = {
                    backgroundColor: '#404a59',
                    title: {
                        text: '房山区乡镇/街道',
                        left: 'center',
                        textStyle: { color: '#fff' }
                    },
                    tooltip: {
                        trigger: 'item',
                        formatter: function(params) {
                            return params.name + '<br/>出现次数: ' + (params.value || 0) + '条';
                        }
                    },
                    visualMap: {
                        min: 0,
                        max: Math.max(...mapData.map(function(d) { return d.value; }), 1),
                        left: 'left',
                        top: 'bottom',
                        text: ['高', '低'],
                        inRange: {
                            color: ['#323c48', '#50a3ba', '#eac736', '#d94e5d', '#ff4500']
                        },
                        textStyle: { color: '#fff' },
                        calculable: true
                    },
                    series: [{
                        name: '数据',
                        type: 'map',
                        map: 'fangshan',
                        selectedMode: false,
                        roam: true,
                        label: {
                            show: true,
                            color: '#fff',
                            fontSize: 10
                        },
                        itemStyle: {
                            areaColor: '#323c48',
                            borderColor: '#111',
                            borderWidth: 0.5
                        },
                        emphasis: {
                            label: { color: '#fff', fontSize: 12 },
                            itemStyle: { areaColor: '#2a333d' }
                        },
                        data: mapData
                    }]
                };

                myChart.setOption(option);
            })
            .catch(function(error) {
                console.error('地图加载失败:', error);
            });
   

        // ========== 拖拽分隔条逻辑 ==========
        var divider = document.getElementById('divider');
        var rightPanel = document.getElementById('rightPanel');
        var leftPanel = document.getElementById('leftPanel');
        var resizeOverlay = document.getElementById('resizeOverlay');
        var isResizing = false;

        divider.addEventListener('mousedown', function(e) {
            // 排除点击折叠按钮的情况
            if (e.target.classList.contains('collapse-btn')) return;

            isResizing = true;
            resizeOverlay.classList.add('active');
            divider.classList.add('active');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';

            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!isResizing) return;

            var containerWidth = document.querySelector('.container').offsetWidth;
            var newRightWidth = containerWidth - e.clientX;

            // 限制最小和最大宽度
            newRightWidth = Math.max(250, Math.min(newRightWidth, containerWidth * 0.7));

            rightPanel.style.width = newRightWidth + 'px';

            e.preventDefault();
        });

        document.addEventListener('mouseup', function() {
            if (!isResizing) return;

            isResizing = false;
            resizeOverlay.classList.remove('active');
            divider.classList.remove('active');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';

            // 通知 echarts 调整尺寸
            myChart.resize();
        });

        // ========== 折叠/展开功能 ==========
        var collapseBtn = document.getElementById('collapseBtn');
        var panelCloseBtn = document.getElementById('panelCloseBtn');

        function togglePanel() {
            var isCollapsed = rightPanel.classList.toggle('collapsed');

            // 切换分隔条显示状态
            if (isCollapsed) {
                divider.style.width = '30px';
                divider.style.background = 'transparent';
            } else {
                divider.style.width = '';
                divider.style.background = '';
            }

            // 延迟让动画完成后 resize
            setTimeout(function() {
                myChart.resize();
            }, 350);
        }

        collapseBtn.addEventListener('click', togglePanel);
        panelCloseBtn.addEventListener('click', togglePanel);

        // 窗口大小改变时自适应
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
